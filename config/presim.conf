# presim.conf
# Presimulation tuning parameters. These are read by presim tools and the
# decision-core when enabled. Keep values numeric; comments are allowed.

# Maximum per-zone error threshold to consider refining (float: 0.0 - 1.0)
presim_threshold_max=0.03

# Multipliers applied when selecting refine fidelity (0..1 means partial)
presim_refine_multiplier=0.8

# Multiplier for high-fidelity selection
presim_high_multiplier=2.0

# Weight applied to per-zone uncertainty when computing priority
presim_uncertainty_weight=1.0

# Comma-separated fidelity -> cores map (e.g. fidelity 0 -> 1 core, 1 -> 3 cores...)
presim_fidelity_map=0,1,3,6
