# orchestrator.conf
# All settings are optional — built-in defaults are used for any missing key.
# Lines starting with '#' are comments.

# ── HTTP server ───────────────────────────────────
listen_port         = 8080

# Scripts exécutés au début de chaque calcul (laisser vide pour désactiver)
# Le script reçoit les variables d'environnement ORCH_JOB_ID, ORCH_INPUT_DIR, ORCH_OUTPUT_DIR
pre_job_script_win   =
pre_job_script_linux =

# ── Paths ─────────────────────────────────────────
work_dir            = jobs
db_path             = orchestrator.db
provisioning_json   = config/provisioning.json

# ── Logging ───────────────────────────────────────
# Levels: debug | info | warn | error
log_level           = info

# ── Scheduler ─────────────────────────────────────
# How often the scheduler checks for runnable jobs (milliseconds)
scheduler_poll_ms   = 500

# ── Cleanup ───────────────────────────────────────
# Seconds after a job reaches a terminal state before its
# work directory (input/ + output/) is deleted.
# Set to 0 to disable automatic cleanup.
cleanup_ttl_seconds = 3600
