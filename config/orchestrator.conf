# orchestrator.conf
# All settings are optional -- built-in defaults are used for any missing key.
# Lines starting with '#' are comments.

# -- HTTP server -------------------------------------------
listen_port         = 8099

# -- Security / Command mode -------------------------------
# "app_only" = users must pick a registered application; raw commands are rejected
# "free"     = users may submit arbitrary commands (trusted environments only)
command_mode        = app_only

# Exact cross-origin URL allowed to call the API. Empty keeps same-origin only.
cors_allowed_origin =

# Set to 1 behind a TLS reverse proxy. Requests must then include
# X-Forwarded-Proto: https.
require_https       = 0

# Shell used for SSH execution (e.g. "rbash" for restricted bash).
# Leave empty for the remote user's default shell.
#ssh_shell          = rbash

# -- Pre-job scripts ---------------------------------------
# Executed at the start of each job. Leave empty to disable.
# Receives env vars: ORCH_JOB_ID, ORCH_INPUT_DIR, ORCH_OUTPUT_DIR,
#                    ORCH_MACHINE_IDS, ORCH_MACHINE_COUNT
pre_job_script_win   = config\pre_job_script_win.bat
pre_job_script_linux =

# -- Remote SSH execution ---------------------------------
# SSH user on remote machines. When set, jobs are dispatched via SSH.
# Leave blank for local-only mode.
#ssh_user            = deploy
#ssh_key             = .ssh\orch_key
ssh_remote_work_dir = /tmp/orch

# -- Application definitions --------------------------------
# Directory containing JSON files that define available applications.
# Each .json file represents one app with its fields and resource defaults.
apps_dir            = config/apps

# -- Paths -------------------------------------------------
# All paths can be absolute or relative to the executable directory.
work_dir            = jobs
db_path             = orchestrator.db
provisioning_json   = config/provisioning.json

# Temporary directory for per-job known_hosts files and other temp data.
# Defaults to system temp (TEMP on Windows, /tmp on Linux).
temp_dir            =

# PID file path (Linux daemon mode only).
pid_file            = /var/run/orchestrator.pid

# -- Logging -----------------------------------------------
# Levels: debug | info | warn | error
log_level           = info

# -- Scheduler ---------------------------------------------
# How often the scheduler checks for runnable jobs (milliseconds)
scheduler_poll_ms   = 500

# -- Job timeout -------------------------------------------
# Maximum seconds a job can be RUNNING before the scheduler
# marks it FAILED and releases its resources. 0 = no global timeout.
# Can also be overridden per-job with the "timeout_seconds" field at submit.
job_timeout_seconds = 3600

# -- Cleanup -----------------------------------------------
# Seconds after a job reaches a terminal state before its
# work directory (input/ + output/) is deleted.
# Set to 0 to disable automatic cleanup.
cleanup_ttl_seconds = 3600

# -- Web UI / Bastion mode ---------------------------------
# Set to 0 to disable the web UI entirely (API-only / bastion mode).
# When disabled, only the REST API is accessible -- no static files are served.
web_ui_enabled      = 0

# v1 ships workflows, cloud/WoL controls and presimulation disabled. Set to 1
# only for compatibility testing; these endpoints are not part of the v1 SLA.
experimental_features_enabled = 0

# Bind address. Use "127.0.0.1" to restrict to localhost,
# "0.0.0.0" (default) for all interfaces.
listen_address      = 0.0.0.0

# -- Machine Availability Probe ----------------------------
# How the scheduler checks whether static machines are reachable.
# method: "tcp" (default), "ping", or "ssh"
probe_method        = tcp
probe_port          = 22
probe_timeout_ms    = 3000
probe_retries       = 2
# Interval between successive probe sweeps (milliseconds)
probe_interval_ms   = 3600000

# -- Cloud Provisioning -----------------------------------
# Path to a cloud credentials file (provider-specific).
# Leave empty to rely on the default CLI credentials (AWS CLI, gcloud, az).
#cloud_credentials_file =

# -- Cloud Auto-Scaling ------------------------------------
# Automatically provision a cloud VM when no machine can satisfy
# a job's resource requirements. The instance is spun up, registered
# in the pool, and the job is dispatched to it.
cloud_auto_provision    = 0

# Automatically deprovision cloud VMs when they become idle
# (no more jobs allocated). Only affects auto-provisioned machines.
cloud_auto_deprovision  = 0

# Default cloud template used for auto-provisioned instances.
# These values are overridden by per-job resource requirements.
#cloud_default_provider      = aws
#cloud_default_instance_type = t3.medium
#cloud_default_region        = us-east-1
#cloud_default_image_id      = ami-0abcdef1234567890

