name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Package
        run: cmake --build build --config Debug --target package --parallel 2

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitize -DBUILD_TESTING=ON -DORCH_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitizers
        run: cmake --build build-sanitize --parallel 2
      - name: Test sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
